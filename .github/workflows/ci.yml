name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run REST tests
        run: npm run test:rest
      - name: Run GraphQL tests
        run: npm run test:graphql
      - name: Run gRPC contract tests
        run: npm run test:grpc
  k6-load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up k6
        uses: grafana/setup-k6-action@v1
      - name: Run k6 load test
        run: k6 run k6/load-test.js
